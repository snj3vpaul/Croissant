<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Croissant</title>
  <link rel="icon" href="croissant.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#fbf3e4" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="hero">
      <button id="buddy" class="buddy" aria-label="Pet Croissant">
        <svg viewBox="0 0 120 90" aria-hidden="true">
          <defs>
            <linearGradient id="bake" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f6c66b" /><stop offset="1" stop-color="#d98a2b" />
            </linearGradient>
          </defs>
          <g stroke="#8a4b14" stroke-width="2.5" stroke-linejoin="round" fill="url(#bake)">
            <path d="M8 62 Q4 44 22 40 Q30 50 34 66 Q20 72 8 62Z" />
            <path d="M112 62 Q116 44 98 40 Q90 50 86 66 Q100 72 112 62Z" />
            <path d="M22 40 Q30 22 46 22 Q50 46 46 72 Q36 72 34 66 Q30 50 22 40Z" />
            <path d="M98 40 Q90 22 74 22 Q70 46 74 72 Q84 72 86 66 Q90 50 98 40Z" />
            <path d="M46 22 Q60 10 74 22 Q78 48 74 72 Q60 80 46 72 Q42 48 46 22Z" />
          </g>
          <g class="eyes open" fill="#3b2208"><ellipse cx="54" cy="46" rx="3" ry="3.6" /><ellipse cx="66" cy="46" rx="3" ry="3.6" /></g>
          <g class="eyes shut" stroke="#3b2208" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M51 47 Q54 49 57 47" /><path d="M63 47 Q66 49 69 47" /></g>
          <path d="M55 55 Q60 59 65 55" fill="none" stroke="#3b2208" stroke-width="2.2" stroke-linecap="round" />
          <circle cx="49" cy="53" r="3" fill="#f0846a" opacity=".55" /><circle cx="71" cy="53" r="3" fill="#f0846a" opacity=".55" />
        </svg>
        <span class="zzz" aria-hidden="true">z<span>z</span><span>z</span></span>
      </button>
      <div class="bubble" id="bubble" aria-live="polite">Oh, hi. I saved you a warm seat.</div>
    </header>

    <form id="ask" class="ask">
      <input id="question" autocomplete="off" placeholder="Did the Sens win? When do Arsenal play next?" aria-label="Ask Croissant" />
      <button>Ask</button>
    </form>

    <section>
      <div class="section-head">
        <h2>My teams</h2>
        <button id="toggle-add" class="ghost">+ Add team</button>
      </div>
      <div id="add" class="add" hidden>
        <input id="search" placeholder="Search any team — Senators, Raptors, Arsenal, India…" autocomplete="off" />
        <ul id="results"></ul>
      </div>
      <div id="teams" class="teams"></div>
      <p id="empty" class="empty" hidden>No teams yet. Add one and I'll keep an eye on it for you.</p>
    </section>

    <details class="settings">
      <summary>Brain &amp; notifications</summary>
      <label>Brain
        <select id="brain">
          <option value="rules">Built-in (no AI, fully local)</option>
          <option value="ollama">Ollama (local model)</option>
          <option value="anthropic">Anthropic Claude (API key)</option>
          <option value="openai">OpenAI (API key)</option>
        </select>
      </label>
      <label>Model <input id="model" placeholder="default" /></label>
      <button id="save-brain" class="ghost">Save</button>
      <button id="notify" class="ghost">Enable desktop notifications</button>
      <p class="fine">API keys come from environment variables and never touch this page. Only public match data and your question are sent to a model brain.</p>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
